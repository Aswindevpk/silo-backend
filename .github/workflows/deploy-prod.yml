name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Deployment Configs to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml,scripts/deploy_commit.sh,scripts/emergency_db_restore.sh"
          target: "/var/www/silo"
          overwrite: true

      - name: Execute Deployment on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/silo

            # Move production compose to standard docker-compose.yml
            mv docker-compose.prod.yml docker-compose.yml

            # Ensure script is executable and execute
            chmod +x scripts/deploy_commit.sh
            ./scripts/deploy_commit.sh

            # Clean up dangling images
            docker image prune -af