version: '3.8'

services:
  db:
    image: postgres:15
    container_name: silo_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: silo_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    container_name: silo_web
    command: gunicorn --access-logfile - -k uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:8000 config.asgi:application
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv  # Protects container's synced virtualenv
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1

  celery:
    build: .
    container_name: silo_celery
    command: celery -A config worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - /app/.venv  # Protects container's synced virtualenv
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  postgres_data:
  redis_data: